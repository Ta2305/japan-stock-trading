[project]
name = "japan-stock-trading"
version = "0.1.0"
description = "J-Quants / kabuステーション API と LightGBM Meta-labeling を用いた日本株自動売買システム"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "yfinance>=0.2.40",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "xlrd>=2.0.1",
    "lightgbm>=4.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
